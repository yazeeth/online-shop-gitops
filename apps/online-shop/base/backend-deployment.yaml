apiVersion: apps/v1
kind: Deployment

metadata:
  name: online-shop-backend
  namespace: online-shop
  annotations:
    argocd.argoproj.io/sync-wave: "2"

spec:
  replicas: 4

  selector:
    matchLabels:
      app: online-shop-backend

  template:
    metadata:
      labels:
        app: online-shop-backend

      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-init-first: "true"
        vault.hashicorp.com/role: "online-shop"
        vault.hashicorp.com/agent-inject-secret-config: "secret/data/online-shop"
        vault.hashicorp.com/agent-inject-template-config: |
          {{- with secret "secret/data/online-shop" -}}
          export DATABASE_URL="{{ .Data.data.DATABASE_URL }}"
          export JWT_ACCESS_SECRET="{{ .Data.data.JWT_ACCESS_SECRET }}"
          export JWT_REFRESH_SECRET="{{ .Data.data.JWT_REFRESH_SECRET }}"
          {{- end }}

    spec:
      serviceAccountName: online-shop-backend

      containers:
        - name: backend
          image: yazeeth/onlineshop-backend:v1.0.10
          ports:
            - containerPort: 5050
          command: ["/bin/sh", "-c"]
          args:
            - |
              . /vault/secrets/config
              exec npm start
          volumeMounts:
            - name: product-uploads
              mountPath: /app/uploads
          envFrom:
            - configMapRef:
                name: online-shop-backend-config
      volumes:
        - name: product-uploads
          persistentVolumeClaim:
            claimName: online-shop-backend-uploads