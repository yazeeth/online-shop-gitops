apiVersion: batch/v1
kind: Job

metadata:
  name: online-shop-backend-migration
  namespace: online-shop
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "1"

spec:
  template:
    metadata:
      labels:
        app: online-shop-backend-migration

    spec:
      restartPolicy: Never

      containers:
        - name: migration
          image: yazeeth/onlineshop-backend:v1.0.12

          envFrom:
            - secretRef:
                name: online-shop-backend-secret

          command:
            - npm
            - run
            - db:migrate