# SAMPLE ONLY — DO NOT USE REAL CREDENTIALS HERE
# Production secrets must NOT be committed to Git.
#
# For local Kind:
#   kubectl create secret generic online-shop-backend-secret ...
#
# For production:
#   Use a proper secret-management solution such as
#   AWS Secrets Manager / Azure Key Vault + External Secrets.

apiVersion: v1
kind: Secret

metadata:
  name: online-shop-backend-secret
  namespace: online-shop

type: Opaque

stringData:
  # PostgreSQL connection string
  DATABASE_URL: "postgresql://shopuser:CHANGE_ME@postgres:5432/onlineshop?schema=public"

  # Generate strong random values for these
  JWT_ACCESS_SECRET: "CHANGE_ME"
  JWT_REFRESH_SECRET: "CHANGE_ME"