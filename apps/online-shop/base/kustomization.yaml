apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - backend-deployment.yaml
  - backend-service.yaml
  - backend-configmap.yaml
  - postgres-service.yaml
  - postgres-statefulset.yaml
  - backend-migration-job.yaml
#  - backend-secret.example.yaml
#  - postgres-secret.example.yaml

# Backend Secret
# ----------------
# The backend Deployment expects a Kubernetes Secret named:
# - online-shop-backend-secret
#
# Sample Secret manifest (documentation only):
#
# apiVersion: v1
# kind: Secret
# metadata:
#   name: online-shop-backend-secret
#   namespace: online-shop
# type: Opaque
# stringData:
#   DATABASE_URL: "postgresql://shopuser:CHANGE_ME@postgres:5432/onlineshop?schema=public"
#   JWT_ACCESS_SECRET: "CHANGE_ME"
#   JWT_REFRESH_SECRET: "CHANGE_ME"
#
# DO NOT commit real credentials to Git.
# For local development, create the Secret separately with kubectl.
# For production, use an external secret manager / External Secrets.

# For local development, create it manually:
#   kubectl create secret generic online-shop-backend-secret \
#     -n online-shop \
#     --from-literal=DATABASE_URL='...' \
#     --from-literal=JWT_ACCESS_SECRET='...' \
#     --from-literal=JWT_REFRESH_SECRET='...'


# PostgreSQL Secret
# ----------------
# The PostgreSQL StatefulSet expects a Kubernetes Secret named:
#   online-shop-postgres-secret
#
# Sample Secret manifest (documentation only):
#
# apiVersion: v1
# kind: Secret
# metadata:
#   name: online-shop-postgres-secret
#   namespace: online-shop
# type: Opaque
# stringData:
#   POSTGRES_DB: "onlineshop"
#   POSTGRES_USER: "shopuser"
#   POSTGRES_PASSWORD: "CHANGE_ME"
#
# DO NOT commit real database credentials to Git.
# For local development, create the Secret separately with kubectl.
# For production, use an external secret manager / External Secrets.

# For local development, create it manually:
#   kubectl create secret generic online-shop-postgres-secret \
#     -n online-shop \
#     --from-literal=POSTGRES_DB='onlineshop' \
#     --from-literal=POSTGRES_USER='shopuser' \
#     --from-literal=POSTGRES_PASSWORD='...'